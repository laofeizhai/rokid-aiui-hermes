  <text x="640" y="185" font-size="28" font-weight="bold" text-anchor="middle" fill="#e6edf3">文字问答</text>

  <!-- 用户问题 -->
  <rect x="330" y="230" width="620" height="90" rx="10" fill="#1c6e2f" stroke="#40FF5E" stroke-width="1.5"/>
  <text x="355" y="270" font-size="15" fill="#bfe9c8">你</text>
  <text x="355" y="300" font-size="22" fill="#ffffff">今天廊坊的天气适合跑步吗？</text>

  <!-- 睿回答 -->
  <rect x="330" y="360" width="620" height="330" rx="10" fill="#161e28" stroke="#3a3a3a"/>
