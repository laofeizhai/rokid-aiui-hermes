<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="960" viewBox="0 0 1280 960" font-family="WenQuanYi Zen Hei, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#131a21"/></linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#40FF5E"/><stop offset="1" stop-color="#1f9d3a"/></linearGradient>
  </defs>
  <rect width="1280" height="960" fill="url(#bg)"/>
  <rect x="280" y="120" width="720" height="720" rx="14" fill="#12181f" stroke="#3a3a3a" stroke-width="3"/>
